[project]
name = "tkie"
version = "0.1.0"
description = "LLM-TKIE: Large Language Model Driven Transferable Key Information Extraction"
requires-python = ">=3.11"
dependencies = [
    "paddlepaddle>=2.6.0",
    "paddleocr>=2.8.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "ollama>=0.3.0",
    "langchain-ollama>=0.1.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tkie"]
